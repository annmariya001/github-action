name: Advanced CI

on:
  push:
    branches:
      - main

env:
  APP_NAME: my-devops-app

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Variables
        run: |
          echo "Application: $APP_NAME"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF"
