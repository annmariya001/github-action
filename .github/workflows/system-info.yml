name: Build Report

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Report
        run: |
          echo "Build completed" > report.txt

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: report.txt
